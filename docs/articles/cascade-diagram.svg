<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg"
     style="max-width:100%;height:auto;font-family:system-ui,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#55606a"/>
    </marker>
  </defs>
  <style>
    .b{fill:#eef3f6;stroke:#1c4e63;stroke-width:1.5;rx:5}
    .s{fill:#fff;stroke:#9aa7b1;stroke-width:1;rx:4}
    .t{font-size:12.5px;fill:#13323f}
    .m{font-size:11px;fill:#55606a}
    .k{font-size:11.5px;font-weight:600;fill:#1c4e63}
    .y{font-size:11px;fill:#1f7a3d;font-weight:600}
    .l{stroke:#55606a;stroke-width:1.3;fill:none;marker-end:url(#a)}
  </style>
  <rect class="b" x="20" y="14" width="200" height="40"/>
  <text class="t" x="34" y="32">grant rows, as filed</text>
  <text class="m" x="34" y="47">name + address text only</text>
  <path class="l" d="M120 54 L120 78"/>
  <rect class="s" x="20" y="78" width="200" height="38"/>
  <text class="t" x="34" y="95">prepare + collapse</text>
  <text class="m" x="34" y="109">one row per recipient identity</text>
  <path class="l" d="M220 97 L258 97"/>
  <rect class="b" x="258" y="70" width="150" height="54"/>
  <text class="k" x="272" y="90">pending queue</text>
  <text class="m" x="272" y="105">starts at 4,964</text>
  <text class="m" x="272" y="117">ends at 2,496</text>
  <path class="l" d="M408 97 L452 97"/>
  <rect class="s" x="452" y="26" width="286" height="60"/>
  <text class="k" x="466" y="44">A &#183; exact</text>
  <text class="m" x="466" y="59">name+ZIP5, name+state, name&#8596;dba</text>
  <text class="y" x="466" y="75">resolves 2,113 &#183; 96,843 candidates</text>
  <rect class="s" x="452" y="96" width="286" height="60"/>
  <text class="k" x="466" y="114">B &#183; shared token, same state</text>
  <text class="m" x="466" y="129">IDF-pruned name-token index</text>
  <text class="y" x="466" y="145">resolves 328 &#183; 1,117,338 candidates</text>
  <rect class="s" x="452" y="166" width="286" height="60"/>
  <text class="k" x="466" y="184">C &#183; exact name, ANY state</text>
  <text class="m" x="466" y="199">cross-state sweep</text>
  <text class="m" x="466" y="215" style="fill:#a3423c;font-weight:600">resolves 0 &#183; 105,389 candidates</text>
  <rect class="s" x="452" y="236" width="286" height="60"/>
  <text class="k" x="466" y="254">D &#183; recovery</text>
  <text class="m" x="466" y="269">initials/acronym, truncated prefix</text>
  <text class="y" x="466" y="285">resolves 27 &#183; 166,465 candidates</text>
  <path class="l" d="M595 86 L595 96"/>
  <path class="l" d="M595 156 L595 166"/>
  <path class="l" d="M595 226 L595 236"/>
  <path class="l" d="M452 56 C420 56 420 70 410 82" />
  <text class="m" x="300" y="150" style="font-size:10.5px">only YES leaves the queue;</text>
  <text class="m" x="300" y="163" style="font-size:10.5px">MAYBE and NO are carried</text>
  <text class="m" x="300" y="176" style="font-size:10.5px">on to the next pass</text>
  <path class="l" d="M595 296 L595 330"/>
  <rect class="b" x="430" y="330" width="330" height="46"/>
  <text class="t" x="444" y="349">score the UNION of all candidates</text>
  <text class="m" x="444" y="364">0.6 &#215; name + 0.4 &#215; geo, then veto / select / tier</text>
  <path class="l" d="M595 376 L595 404"/>
  <rect class="b" x="300" y="404" width="150" height="40"/>
  <text class="t" x="314" y="422">YES 3,050</text>
  <text class="m" x="314" y="436">auto-accepted</text>
  <rect class="b" x="466" y="404" width="150" height="40"/>
  <text class="t" x="480" y="422">MAYBE 1,058</text>
  <text class="m" x="480" y="436">to adjudication</text>
  <rect class="b" x="632" y="404" width="128" height="40"/>
  <text class="t" x="646" y="422">NO 734</text>
  <text class="m" x="646" y="436">residual</text>
  <path class="l" d="M520 376 L400 404"/>
  <path class="l" d="M660 376 L700 404"/>
</svg>
